[project]
name = "polarisation-network"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ppxnda", email = "jessejoseph.panda@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "atproto>=0.0.73",
    "bambi>=0.21.0",
    "convokit>=5.0.0",
    "datasets>=5.1.0",
    "detoxify>=0.5.4",
    "duckdb>=2.0.0",
    "ewstools>=2.1.3",
    "faster-whisper>=1.2.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "krippendorff>=0.9.0",
    "leidenalg>=0.12.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numba>=0.68.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "python-igraph>=1.0.0",
    "salib>=1.6.0",
    "sbi>=0.27.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "websockets>=17.4",
]

[project.scripts]
polarisation-network = "polarisation_network:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
